# Runs anywhere: a fake llama-server and a fake Jupyter, `sleep` standing in
# for voice. Build first (`pnpm build`), then
# `node dist/cli.js agent --config examples/demo.yaml`.
listen: 127.0.0.1:7340
tick: 2s
# First matters most: Jupyter, then the LLM, then voice in the background.
services:
  - name: jupyter
    plugin: jupyter
    remind: 1m
    url: http://127.0.0.1:18888
    cmd: [node, dist/cli.js, fake, jupyter, --port, "18888"]
  - name: llm
    plugin: llamacpp
    idle: 30s
    url: http://127.0.0.1:18080
    models: [bonsai]
    cmd: [node, dist/cli.js, fake, llama, --port, "18080", --load-ms, "3000"]
  - name: voice
    run: always
    cmd: [sleep, infinity]
