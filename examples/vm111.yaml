# RTX 3080, 10 GB. JupyterLab by hand, Bonsai 27B on demand, voice for Home
# Assistant the rest of the time. Runs as root, next to the units it controls.
listen: 0.0.0.0:7340
services:
  - name: jupyter
    plugin: jupyter
    remind: 3h
    gpu_guard: 20
    token_env: JUPYTER_TOKEN
    unit: jupyter-3080.service
  - name: bonsai
    plugin: llamacpp
    idle: 20m
    ready_timeout: 3m
    models: [bonsai]
    unit: bonsai-3080.service
  - name: voice
    plugin: wyoming
    group:
      - unit: wyoming-faster-whisper.service
        health: tcp://127.0.0.1:10300
      - unit: wyoming-kokoro.service
        health: tcp://127.0.0.1:10800
      - unit: qwen35-3080.service
        health: http://127.0.0.1:8080/health
